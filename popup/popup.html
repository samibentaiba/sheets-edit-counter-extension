<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheets Edit Counter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <div class="logo">📊</div>
        <div>
          <h1>Sheets Edit Counter</h1>
          <p class="subtitle">Maisonette Deco &bull; Team Activity</p>
        </div>
      </div>
      <span id="sheetStatus" class="status-badge checking">Checking Tab...</span>
    </header>

    <!-- Preset Period Filters -->
    <section class="section">
      <div class="filter-group">
        <label class="section-label">Quick Period / الفترة:</label>
        <div class="btn-group">
          <button class="pill-btn active" data-period="today">Today</button>
          <button class="pill-btn" data-period="week">7 Days</button>
          <button class="pill-btn" data-period="month">This Month</button>
          <button class="pill-btn" data-period="custom">Custom</button>
        </div>
      </div>

      <!-- Custom Date Range (collapsible or displayed when custom selected) -->
      <div id="customDateContainer" class="date-range-row hidden">
        <div class="input-field">
          <label for="startDate">From (من):</label>
          <input type="date" id="startDate">
        </div>
        <div class="input-field">
          <label for="endDate">To (إلى):</label>
          <input type="date" id="endDate">
        </div>
        <button id="applyCustomDateBtn" class="apply-btn">Apply</button>
      </div>

      <!-- User Dropdown Filter -->
      <div class="user-select-row">
        <label for="userFilter">Collaborator / المستخدم:</label>
        <select id="userFilter">
          <option value="ALL">All Collaborators (الكل)</option>
        </select>
      </div>
    </section>

    <!-- KPI Summary Cards -->
    <section class="kpi-grid">
      <div class="kpi-card highlight">
        <span class="kpi-title">Selected Edits</span>
        <span id="kpiSelectedEdits" class="kpi-value">0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-title">Active Users</span>
        <span id="kpiActiveUsers" class="kpi-value">0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-title">All-Time Total</span>
        <span id="kpiTotalEdits" class="kpi-value">0</span>
      </div>
    </section>

    <!-- Collaborators Breakdown Table -->
    <section class="table-section">
      <div class="table-header-row">
        <span class="section-label">User Breakdown / تفصيل الأعضاء</span>
        <span id="recordCount" class="record-count">0 users</span>
      </div>
      <div class="table-scroll">
        <table id="statsTable">
          <thead>
            <tr>
              <th>Collaborator</th>
              <th>Today</th>
              <th>Week</th>
              <th>Month</th>
              <th id="thCustomRange">Range</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="statsTableBody">
            <tr class="empty-row">
              <td colspan="6">Click "Scan History" or load data to view counts.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Bottom Actions -->
    <footer class="footer">
      <button id="scanBtn" class="primary-btn">
        <span>🔄</span> Scan Active Sheet
      </button>
      <button id="exportBtn" class="secondary-btn" title="Export as CSV">
        <span>📥</span> Export CSV
      </button>
      <button id="demoBtn" class="ghost-btn" title="Load sample data for testing">
        🧪 Demo Data
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
